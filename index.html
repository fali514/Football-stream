<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveSports - Free Streaming</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Fixed HLS.js library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
</head>
<body>
    <header class="navbar">
        <div class="logo">🏆 Live<span>Sports</span></div>
        <nav>
            <a href="#" class="active">Live Matches</a>
            <a href="#">Schedule</a>
            <a href="#">Leagues</a>
        </nav>
    </header>

    <main class="container">
        <section class="stream-section">
            <div class="video-container">
                <video id="video-player" controls autoplay muted playsinline></video>
            </div>
            <div class="match-details">
                <h1 id="match-title">Loading Match...</h1>
                <p id="match-status">🔴 LIVE | 1080p 60fps</p>
                <p id="live-score" style="color:#a0a5b1; margin-top:8px;"></p>
            </div>
        </section>

        <aside class="chat-section">
            <h3>Live Fan Chat</h3>
            <div class="chat-box" id="chat-box"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Send a message...">
                <button id="send-btn">Send</button>
            </div>
        </aside>
    </main>

    <section class="channels-section">
        <h2>Available Live Channels (Demo Streams)</h2>
        <div class="channels-grid" id="channels-grid"></div>
        
        <h2 style="margin-top:40px;">🔴 Real Live Matches Now - Auto Updating</h2>
        <div class="channels-grid" id="live-matches-grid"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
