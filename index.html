<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STRIKE STREAM | Premium Free Football Hub</title>
    <!-- FIX: Corrected Video.js CSS CDN path -->
    <link href="https://zencdn.net" rel="stylesheet" />
    <style>
        :root {
            --bg-main: #060b13;
            --bg-card: #0f172a;
            --accent: #00ff88; /* Neon sports green */
            --accent-hover: #00cc6c;
            --text: #ffffff;
            --text-muted: #94a3b8;
        }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-main); color: var(--text); margin: 0; padding: 20px; }
        header { text-align: center; padding: 20px; background: var(--bg-card); border-bottom: 3px solid var(--accent); border-radius: 12px; margin-bottom: 25px; box-shadow: 0 4px 20px rgba(0, 255, 136, 0.1); }
        h1 { margin: 0; font-size: 26px; color: var(--text); letter-spacing: 1px; }
        h1 span { color: var(--accent); }
        .layout { display: grid; grid-template-columns: 1fr 3fr; gap: 25px; max-width: 1500px; margin: 0 auto; }
        @media (max-width: 1024px) { .layout { grid-template-columns: 1fr; } }
        .sidebar { background: var(--bg-card); padding: 20px; border-radius: 12px; height: fit-content; border: 1px solid #1e293b; }
        .sidebar-title { margin-top:0; font-size: 16px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #1e293b; padding-bottom: 12px; margin-bottom: 15px; }
        .match-btn { background: #1e293b; border: 1px solid #334155; padding: 15px; margin-bottom: 12px; border-radius: 8px; cursor: pointer; text-align: left; width: 100%; color: #fff; display: block; transition: all 0.3s ease; }
        .match-btn:hover { background: #334155; border-color: var(--accent); transform: translateY(-2px); }
        .match-btn strong { color: var(--accent); display: block; font-size: 11px; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 0.5px; }
        .active-match { background: var(--accent) !important; color: #000 !important; border-color: var(--accent) !important; font-weight: bold; box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3); }
        .active-match strong { color: #000 !important; }
        .player-panel { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .video-box { position: relative; width: 100%; background: #000; border-radius: 10px; overflow: hidden; margin: 0 auto; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .video-js { width: 100% !important; height: auto !important; aspect-ratio: 16/9; }
        /* Custom Premium VideoJS Skin Overrides */
        .video-js .vjs-big-play-button { background-color: rgba(0, 255, 136, 0.8) !important; border-color: var(--accent) !important; color: #000 !important; border-radius: 50% !important; width: 70px !important; height: 70px !important; line-height: 70px !important; margin-left: -35px !important; margin-top: -35px !important; }
        .video-js .vjs-control-bar { background-color: rgba(15, 23, 42, 0.9) !important; }
        .video-js .vjs-play-progress { background-color: var(--accent) !important; }
        #match-title { margin: 20px 0 5px 0; color: #fff; font-size: 22px; text-align: left; }
        .status-badge { inline-size: fit-content; background: rgba(0, 255, 136, 0.15); color: var(--accent); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; display: inline-block; margin-top: 5px; }
    </style>
</head>
<body>

<header>
    <h1>⚡ STRIKE<span>STREAM</span> NETWORK</h1>
    <p style="margin:5px 0 0 0; color: var(--text-muted); font-size:13px; letter-spacing: 0.5px;">Ultra HD Free Sports Distribution Platform</p>
</header>

<div class="layout">
    <!-- Active Channels Sidebar -->
    <div class="sidebar">
        <h2 class="sidebar-title">⚡ Live Feeds</h2>
        <div id="dynamic-links-container"></div>
    </div>

    <!-- Active Stream Viewscreen -->
    <div class="player-panel">
        <div class="video-box">
            <!-- HTML5 Video Component -->
            <video id="api-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" poster="https://unsplash.com">
            </video>
        </div>
        <h3 id="match-title">Loading Match...</h3>
        <div class="status-badge">● LIVE ULTRA HD</div>
    </div>
</div>

<!-- FIX: Corrected Video.js Main Engine Script CDN Path -->
<script src="https://zencdn.net"></script>

<script>
    let player;

    // FIX: Replaced broken placeholder domains with real working, open-source legal test streams
    const activeFeeds = [
        { 
            name: "Red Bull TV Live Event Feed", 
            url: "https://akamaized.net" /* DASH fallback or alternate test stream */,
            hlsUrl: "https://unified-streaming.com"
        },
        { 
            name: "Premium Sports Feed 01 (Test Stream)", 
            hlsUrl: "https://mux.dev" 
        },
        { 
            name: "Premium Sports Feed 02 (Test Stream)", 
            hlsUrl: "https://longtailvideo.com" 
        }
    ];

    document.addEventListener("DOMContentLoaded", () => {
        // Init Video.js Engine fluid scale
        player = videojs('api-player', {
            fluid: true,
            playbackRates: [0.5, 1, 1.5, 2],
            userActions: { hotkeys: true }
        });

        renderChannelSidebar();
        
        // Auto-load first channel
        if(activeFeeds.length > 0) {
            switchLiveStream(activeFeeds[0].hlsUrl, activeFeeds[0].name);
        }
    });

    function renderChannelSidebar() {
        const container = document.getElementById('dynamic-links-container');
        container.innerHTML = ""; 

        activeFeeds.forEach((server, index) => {
            const btn = document.createElement('button');
            btn.className = "match-btn";
            if(index === 0) btn.classList.add('active-match');

            btn.onclick = () => {
                document.querySelectorAll('.match-btn').forEach(b => b.classList.remove('active-match'));
                btn.classList.add('active-match');
                switchLiveStream(server.hlsUrl, server.name);
            };

            btn.innerHTML = `
                <strong>📡 STRIKE FEED HD 0${index + 1}</strong>
                ${server.name}
            `;
            container.appendChild(btn);
        });
    }

    function switchLiveStream(url, name) {
        document.getElementById('match-title').innerText = name;
        if (player) {
            player.src({ src: url, type: 'application/x-mpegURL' });
            player.load();
            
            player.play().catch(err => {
                console.log("Interaction required to initiate audio streaming playback layout.");
            });
        }
    }
</script>

</body>
</html>
