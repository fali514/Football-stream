<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveSports - Free Streaming</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Include HLS.js library for live stream playback support -->
    <script src="https://mux.dev"></script>
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="logo">🏆 Live<span>Sports</span></div>
        <nav>
            <a href="#" class="active">Live Matches</a>
            <a href="#">Schedule</a>
            <a href="#">Leagues</a>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="container">
        <!-- Left Side: Video Player & Match Info -->
        <section class="stream-section">
            <div class="video-container">
                <video id="video-player" controls autoplay muted></video>
            </div>
            <div class="match-details">
                <h1 id="match-title">Loading Match...</h1>
                <p id="match-status">🔴 LIVE | 1080p 60fps</p>
            </div>
        

        <!-- Right Side: Sidebar Chat Simulation -->
        <aside class="chat-section">
            <h3>Live Fan Chat</h3>
            <div class="chat-box" id="chat-box">
                <!-- Chat messages injected by JS -->
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Send a message...">
                <button id="send-btn">Send</button>
            </div>
        </aside>
    </main>

    <!-- Bottom Section: Grid of Available Channels -->
    <section class="channels-section">
        <h2>Available Live Channels</h2>
        <div class="channels-grid" id="channels-grid">
            <!-- Channel cards injected by JS -->
        </div>
    

    <script src="script.js"></script>
</body>
</html>
