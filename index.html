<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Live Football Streaming</title>
    <!-- Video.js Styles -->
    <link href="https://zencdn.net" rel="stylesheet" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 10px 0;
            background-color: #1f1f1f;
            border-bottom: 3px solid #00ff66;
            margin-bottom: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
        .schedule {
            background: #1f1f1f;
            padding: 15px;
            border-radius: 8px;
        }
        .match-card {
            background: #2a2a2a;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
            border-left: 4px solid #00ff66;
            transition: 0.2s;
        }
        .match-card:hover {
            background: #333333;
        }
        .player-section {
            background: #1f1f1f;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .video-container {
            width: 100%;
            position: relative;
            background: #000;
            border-radius: 5px;
            overflow: hidden;
        }
        #current-match-title {
            margin-top: 10px;
            color: #00ff66;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚽ Live Football Stream Directory</h1>
    </header>

    <div class="container">
        <!-- Match Schedule Sidebar -->
        <div class="schedule">
            <h2>Today's Matches</h2>
            
            <!-- Match 1 -->
            <div class="match-card" onclick="changeStream('https://mux.dev', 'Match 1: Team A vs Team B')">
                <strong>19:45 BST</strong>
                <div>Team A vs Team B</div>
            </div>

            <!-- Match 2 -->
            <div class="match-card" onclick="changeStream('YOUR_M3U8_STREAM_URL_2', 'Match 2: Team C vs Team D')">
                <strong>20:00 BST</strong>
                <div>Team C vs Team D</div>
            </div>
        </div>

        <!-- Video Player Window -->
        <div class="player-section">
            <div class="video-container">
                <video id="my-video" class="video-js vjs-default-skin vjs-16-9" controls preload="auto" width="100%">
                    <source src="https://mux.dev" type="application/x-mpegURL">
                </video>
            </div>
            <h3 id="current-match-title">Match 1: Team A vs Team B</h3>
            <p style="font-size: 12px; color: #aaa;">Click a match on the left to swap streams. If using an embed code instead of an m3u8 link, replace the video tag with an iframe.</p>
        </div>
    </div>

    <!-- Video.js Script -->
    <script src="https://zencdn.net"></script>
    <script>
        var player = videojs('my-video');

        function changeStream(url, matchName) {
            document.getElementById('current-match-title').innerText = matchName;
            player.src({
                src: url,
                type: 'application/x-mpegURL'
            });
            player.play();
        }
    </script>
</body>
</html>
